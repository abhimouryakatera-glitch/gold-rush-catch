<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gold Rush Catch</title> <link rel="manifest" href="manifest.json">
<style>
  :root{
    --navy: #070a13;
    --navy2: #0e1526;
    --gold: #f0b90b;
    --gold-dim: #a8790a;
    --green: #16c784;
    --red: #ef4444;
    --purple: #a78bfa;
    --text: #e8ecf5;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%; overflow:hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    touch-action: none;
  }
  #wrap {
    position:relative;
    width:100vw; height:100vh;
    max-width:480px; margin:0 auto;
    overflow:hidden;
    background: radial-gradient(circle at 50% 0%, #131c33 0%, var(--navy) 65%);
  }
  canvas {
    display:block;
    width:100%; height:100%;
  }
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 16px;
    pointer-events:none;
    z-index:5;
  }
  .hud-chip {
    background: rgba(14,21,38,0.7);
    border: 1px solid rgba(240,185,11,0.3);
    border-radius: 10px;
    padding: 6px 12px;
    font-weight:700;
    font-size: 14px;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
    transition: transform 0.15s;
  }
  #score { color: var(--gold); }
  #combo {
    position:absolute;
    left:50%; top: 70px;
    transform: translateX(-50%) scale(0);
    color: var(--gold);
    font-weight: 900;
    font-size: 22px;
    text-shadow: 0 0 12px rgba(240,185,11,0.7);
    z-index: 6;
    pointer-events:none;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
    opacity: 0;
  }
  #combo.show { transform: translateX(-50%) scale(1); opacity: 1; }

  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background: rgba(6,9,17,0.92);
    z-index: 10;
    padding: 24px;
  }
  #overlay h1 {
    font-size: 32px;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-shadow: 0 0 24px rgba(240,185,11,0.45);
    font-weight: 900;
  }
  #overlay .sub {
    color: #9aa4bd;
    font-size: 14px;
    margin-bottom: 20px;
    max-width: 280px;
    line-height: 1.6;
  }
  .legend {
    display:flex; gap:16px; justify-content:center;
    margin-bottom: 18px;
    font-size: 12px;
    color: #9aa4bd;
  }
  .legend span { display:flex; align-items:center; gap:4px; }
  #overlay .stat {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .best { color: var(--green); font-weight:800; }
  button#startBtn {
    margin-top: 16px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #14100a;
    border: none;
    font-weight: 900;
    font-size: 17px;
    padding: 15px 44px;
    border-radius: 30px;
    box-shadow: 0 8px 24px rgba(240,185,11,0.4);
    letter-spacing: 0.5px;
  }
  button#startBtn:active { transform: scale(0.95); }

  #muteBtn {
    position:absolute; bottom:16px; right:16px;
    background: rgba(14,21,38,0.7);
    border: 1px solid rgba(240,185,11,0.3);
    border-radius: 50%;
    width: 40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    z-index: 20;
    color: var(--text);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  .shake { animation: shake 0.35s; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-chip">SCORE <span id="score">0</span></div>
    <div class="hud-chip">BEST <span id="best">0</span></div>
    <div class="hud-chip" id="lives">❤️❤️❤️</div>
  </div>
  <div id="combo"></div>

  <button id="muteBtn">🔊</button>

  <div id="overlay">
    <h1>GOLD RUSH CATCH</h1>
    <div class="sub">Basket drag karke items pakdo.<br>Combo banao, power-ups collect karo!</div>
    <div class="legend">
      <span>🪙 +1</span>
      <span>💎 +5</span>
      <span>🧲 Magnet</span>
      <span>⭐ Shield</span>
      <span>💣 -1 Life</span>
    </div>
    <div class="stat">Best Score: <span class="best" id="bestStart">0</span></div>
    <button id="startBtn">▶ START</button>
  </div>
</div>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const bestStartEl = document.getElementById('bestStart');
  const livesEl = document.getElementById('lives');
  const comboEl = document.getElementById('combo');
  const muteBtn = document.getElementById('muteBtn');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let audioCtx = null;
  let muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
  }
  function beep(freq, dur, type, vol, delay){
    if(muted || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.15, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }
  function sfxCoin(){ beep(880,0.12,'triangle',0.12); beep(1320,0.1,'triangle',0.08,0.04); }
  function sfxGem(){ beep(660,0.08,'square',0.1); beep(990,0.1,'square',0.1,0.05); beep(1320,0.14,'square',0.1,0.1); }
  function sfxBomb(){ beep(120,0.3,'sawtooth',0.18); beep(80,0.35,'sawtooth',0.15,0.05); }
  function sfxPower(){ beep(523,0.1,'sine',0.12); beep(659,0.1,'sine',0.12,0.08); beep(784,0.16,'sine',0.12,0.16); }
  function sfxCombo(n){ beep(600 + n*40, 0.1, 'triangle', 0.1); }
  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  const STORAGE_KEY = 'goldRushCatchBest2';
  let best = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
  bestEl.textContent = best;
  bestStartEl.textContent = best;

  let basket = { w: 74, h: 46, x: 0, y: 0, targetX: 0 };
  let items = [];
  let particles = [];
  let floaters = [];
  let score = 0;
  let lives = 3;
  let running = false;
  let spawnTimer = 0;
  let spawnInterval = 850;
  let speedMul = 1;
  let lastT = 0;
  let elapsed = 0;
  let combo = 0;
  let comboTimer = 0;
  let magnetTime = 0;
  let shieldActive = false;
  let bgHue = 0;

  function resetGame(){
    basket.x = W/2 - basket.w/2;
    basket.targetX = basket.x;
    basket.y = H - 100;
    items = [];
    particles = [];
    floaters = [];
    score = 0;
    lives = 3;
    spawnTimer = 0;
    spawnInterval = 850;
    speedMul = 1;
    elapsed = 0;
    combo = 0;
    comboTimer = 0;
    magnetTime = 0;
    shieldActive = false;
    scoreEl.textContent = 0;
    renderLives();
  }

  function renderLives(){
    livesEl.textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(3-lives,0));
  }

  function spawnItem(){
    const roll = Math.random();
    let type;
    if(roll < 0.22) type = 'bomb';
    else if(roll < 0.30) type = 'gem';
    else if(roll < 0.35) type = 'magnet';
    else if(roll < 0.40) type = 'shield';
    else type = 'coin';

    const size = type === 'bomb' ? 38 : (type === 'coin' ? 32 : 36);
    items.push({
      x: Math.random() * (W - size) + size/2,
      y: -size,
      r: size/2,
      vy: (1.7 + Math.random()*1.3) * speedMul,
      type,
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*0.08
    });
  }

  function pointerMove(clientX){
    const rect = canvas.getBoundingClientRect();
    let x = clientX - rect.left - basket.w/2;
    x = Math.max(0, Math.min(W - basket.w, x));
    basket.targetX = x;
  }

  canvas.addEventListener('touchstart', e=>{ ensureAudio(); pointerMove(e.touches[0].clientX); }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ pointerMove(e.touches[0].clientX); }, {passive:true});
  canvas.addEventListener('mousedown', e=>{ ensureAudio(); draggingMouse = true; pointerMove(e.clientX); });
  let draggingMouse = false;
  window.addEventListener('mousemove', e=>{ if(draggingMouse) pointerMove(e.clientX); });
  window.addEventListener('mouseup', ()=> draggingMouse = false);

  function spawnParticles(x, y, color, count){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 1.5 + Math.random()*3;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - 1,
        life: 1,
        color,
        size: 2 + Math.random()*3
      });
    }
  }

  function spawnFloater(x, y, text, color){
    floaters.push({ x, y, text, color, life: 1, vy: -1.2 });
  }

  function drawBasket(){
    const {x,y,w,h} = basket;
    ctx.save();
    ctx.translate(x + w/2, y + h/2);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, h/2 + 8, w/2.2, 7, 0, 0, Math.PI*2);
    ctx.fill();

    if(shieldActive){
      ctx.save();
      ctx.strokeStyle = 'rgba(167,139,250,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, -4, w/1.5, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    if(magnetTime > 0){
      ctx.save();
      ctx.strokeStyle = 'rgba(240,185,11,0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.arc(0, -4, w/1.3, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    const grad = ctx.createLinearGradient(-w/2,0,w/2,0);
    grad.addColorStop(0, '#8a5a1f');
    grad.addColorStop(0.5, '#c9903c');
    grad.addColorStop(1, '#8a5a1f');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-w/2, -h/2);
    ctx.lineTo(w/2, -h/2);
    ctx.lineTo(w/2 - 8, h/2);
    ctx.lineTo(-w/2 + 8, h/2);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#f0b90b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w/2 - 2, -h/2);
    ctx.lineTo(w/2 + 2, -h/2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(i*(w/6), -h/2+4);
      ctx.lineTo(i*(w/7), h/2-4);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawItem(it){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    if(it.type === 'coin'){
      const grad = ctx.createRadialGradient(-it.r*0.3,-it.r*0.3,2,0,0,it.r);
      grad.addColorStop(0, '#fff6cf');
      grad.addColorStop(0.4, '#f0b90b');
      grad.addColorStop(1, '#a8790a');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,it.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#7a5906';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#7a5906';
      ctx.font = `bold ${it.r*0.9}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
    } else if(it.type === 'gem'){
      const grad = ctx.createLinearGradient(-it.r,-it.r,it.r,it.r);
      grad.addColorStop(0, '#7ef7d4');
      grad.addColorStop(1, '#16c784');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0,-it.r);
      ctx.lineTo(it.r*0.85, -it.r*0.2);
      ctx.lineTo(it.r*0.5, it.r);
      ctx.lineTo(-it.r*0.5, it.r);
      ctx.lineTo(-it.r*0.85, -it.r*0.2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#0b7a52';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if(it.type === 'magnet'){
      ctx.fillStyle = '#f0b90b';
      ctx.font = `${it.r*1.6}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧲', 0, 2);
    } else if(it.type === 'shield'){
      ctx.font = `${it.r*1.6}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⭐', 0, 2);
    } else {
      ctx.fillStyle = '#1c1f26';
      ctx.beginPath();
      ctx.arc(0,0,it.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.strokeStyle = '#c9903c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(it.r*0.3, -it.r*0.8);
      ctx.lineTo(it.r*0.7, -it.r*1.3);
      ctx.stroke();
      ctx.fillStyle = '#f0b90b';
      ctx.beginPath();
      ctx.arc(it.r*0.7, -it.r*1.3, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBg(dt){
    bgHue += dt*0.01;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = 'rgba(240,185,11,0.035)';
    for(let i=0;i<6;i++){
      ctx.beginPath();
      ctx.arc((i*97 + elapsed*0.015)%W, (i*53 + Math.sin(elapsed*0.0005+i)*20)%H, 55, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx * (dt/16);
      p.y += p.vy * (dt/16);
      p.vy += 0.08 * (dt/16);
      p.life -= 0.025 * (dt/16);
      if(p.life <= 0){ particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function updateFloaters(dt){
    for(let i=floaters.length-1;i>=0;i--){
      const f = floaters[i];
      f.y += f.vy * (dt/16);
      f.life -= 0.02 * (dt/16);
      if(f.life <= 0){ floaters.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(f.life,0);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function showCombo(n){
    if(n < 2) return;
    comboEl.textContent = `🔥 COMBO x${n}`;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
    sfxCombo(n);
  }

  function screenShake(){
    wrap.classList.remove('shake');
    void wrap.offsetWidth;
    wrap.classList.add('shake');
  }

  function endGame(){
    running = false;
    if(score > best){
      best = score;
      localStorage.setItem(STORAGE_KEY, String(best));
    }
    bestEl.textContent = best;
    bestStartEl.textContent = best;
    document.querySelector('#overlay h1').textContent = 'GAME OVER';
    document.querySelector('#overlay .sub').innerHTML = `Score: <b style="color:var(--gold)">${score}</b><br>Fir se try karo aur best todo!`;
    document.querySelector('.legend').style.display = 'none';
    startBtn.textContent = '↻ RESTART';
    overlay.style.display = 'flex';
  }

  function loop(t){
    if(!running) return;
    const dt = lastT ? (t - lastT) : 16;
    lastT = t;
    elapsed += dt;
    speedMul = 1 + elapsed/50000;
    spawnInterval = Math.max(400, 850 - elapsed/70);

    basket.x += (basket.targetX - basket.x) * 0.28;

    if(comboTimer > 0){
      comboTimer -= dt;
      if(comboTimer <= 0) combo = 0;
    }
    if(magnetTime > 0) magnetTime -= dt;

    spawnTimer += dt;
    if(spawnTimer > spawnInterval){
      spawnTimer = 0;
      spawnItem();
    }

    drawBg(dt);

    const basketCenterX = basket.x + basket.w/2;

    for(let i = items.length - 1; i >= 0; i--){
      const it = items[i];

      if(magnetTime > 0 && it.type !== 'bomb' && it.y > H*0.3){
        it.x += (basketCenterX - it.x) * 0.05;
      }

      it.y += it.vy * (dt/16);
      it.rot += it.vrot;

      const bx1 = basket.x, bx2 = basket.x + basket.w;
      const by = basket.y + 6;
      if(it.y + it.r >= by && it.y - it.r <= basket.y + basket.h &&
         it.x >= bx1 && it.x <= bx2){
        if(it.type === 'bomb'){
          if(shieldActive){
            shieldActive = false;
            spawnParticles(it.x, it.y, '#a78bfa', 14);
            spawnFloater(it.x, it.y - 10, 'BLOCKED', '#a78bfa');
          } else {
            lives -= 1;
            combo = 0;
            renderLives();
            spawnParticles(it.x, it.y, '#ef4444', 18);
            screenShake();
            sfxBomb();
          }
          items.splice(i,1);
          if(lives <= 0){ endGame(); return; }
          continue;
        } else if(it.type === 'magnet'){
          magnetTime = 6000;
          spawnParticles(it.x, it.y, '#f0b90b', 12);
          spawnFloater(it.x, it.y - 10, 'MAGNET!', '#f0b90b');
          sfxPower();
          items.splice(i,1);
          continue;
        } else if(it.type === 'shield'){
          shieldActive = true;
          spawnParticles(it.x, it.y, '#a78bfa', 12);
          spawnFloater(it.x, it.y - 10, 'SHIELD!', '#a78bfa');
          sfxPower();
          items.splice(i,1);
          continue;
        } else {
          combo += 1;
          comboTimer = 1400;
          const base = it.type === 'gem' ? 5 : 1;
          const bonus = combo >= 2 ? Math.floor(base * (combo-1) * 0.5) : 0;
          const gained = base + bonus;
          score += gained;
          scoreEl.textContent = score;
          spawnParticles(it.x, it.y, it.type === 'gem' ? '#16c784' : '#f0b90b', it.type === 'gem' ? 10 : 6);
          spawnFloater(it.x, it.y - 10, '+' + gained, it.type === 'gem' ? '#16c784' : '#f0b90b');
          if(it.type === 'gem') sfxGem(); else sfxCoin();
          showCombo(combo);
          items.splice(i,1);
          continue;
        }
      }

      if(it.y - it.r > H){
        if(it.type !== 'bomb') combo = 0;
        items.splice(i,1);
        continue;
      }

      drawItem(it);
    }

    updateParticles(dt);
    updateFloaters(dt);
    drawBasket();

    requestAnimationFrame(loop);
  }

  function startGame(){
    ensureAudio();
    resize();
    resetGame();
    document.querySelector('.legend').style.display = 'flex';
    overlay.style.display = 'none';
    running = true;
    lastT = 0;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
